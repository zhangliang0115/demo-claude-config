<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>zl-dev · 阶段页面演示</title>
<style>
:root{font:14px/1.65 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#202631;background:#f5f6f8;--muted:#677181;--line:#e1e5eb;--accent:#365ee8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px}header{background:#fff;border-bottom:1px solid var(--line)}h1{font-size:30px;line-height:1.3;letter-spacing:-.03em;margin:12px 0}h2{font-size:20px;margin:0}h3{font-size:17px;line-height:1.45;margin:10px 0}p{margin:6px 0}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em}.muted{color:var(--muted);font-size:12px}.intro{max-width:76ch;color:#526274}.notice{font-size:12px;color:#79602c;margin-top:14px}.toolbar{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:25px}.filters{display:flex;flex-wrap:wrap;gap:6px}button,input{font:inherit;min-height:38px;border-radius:5px;border:1px solid #d4dae3;background:#fff;padding:7px 12px;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}input{width:240px;max-width:100%}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #91a6f6;outline-offset:3px}.stage-heading{margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.demo{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;padding:20px;background:#fff;min-width:0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;background:#edf1ff;color:#3653a3;padding:2px 7px;border-radius:3px}.purpose{font-size:13px;flex:1}.reading{margin:14px 0;border-top:1px solid #edf1f4;padding-top:10px}.reading ol{font-size:12px;margin:4px 0;padding-left:20px;color:#526274}.demo>a{display:block;text-decoration:none;color:var(--accent);font-size:13px;font-weight:650;border-top:1px solid #edf1f4;padding-top:12px}.demo>a:hover{text-decoration:underline}footer{margin-top:28px;padding:16px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.empty{padding:24px;color:var(--muted);background:#fff;border:1px solid var(--line)}@media(max-width:650px){.wrap{padding:20px 16px}h1{font-size:25px}.grid{grid-template-columns:1fr}.toolbar{align-items:stretch}.toolbar label,input{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">ZL-DEV / 插件演示入口</div><h1>先选阶段，再打开这一阶段的页面</h1><p class="intro">实际工作中，AI 每次生成的是当前任务、当前阶段的独立报告。这个目录只用于对比插件的展示效果；它不是某个真实任务的报告，也不汇总各阶段的业务内容。</p><p class="notice">以下均为模拟案例，示例中的实现、原型及测试记录不代表真实业务已经开发或验证。</p></div></header>
<main class="wrap"><div class="toolbar"><div class="filters" id="filters" role="group" aria-label="选择要演示的阶段"></div><label><span class="muted">搜索本阶段场景 </span><input id="query" type="search" placeholder="例如：取消、故障、升级" aria-label="搜索本阶段场景"></label></div><section aria-labelledby="stage-title"><div class="stage-heading"><h2 id="stage-title"></h2><p class="muted" id="stage-purpose"></p><p class="muted" id="count" aria-live="polite"></p></div><div id="groups" class="grid"></div></section><footer>每个链接单独打开一份阶段报告。切换上方阶段可查看其他示例；真实使用时直接打开 AI 为当前阶段生成的 report.html。</footer></main>
<script type="application/json" id="data">[{"id": "bugfix-repeated-cancel", "title": "修复重复取消导致库存多加的问题", "category": "排障", "stage": "testing", "purpose": "先复现，再核对原因和修复证据", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "验证中", "href": "bugfix-repeated-cancel/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "cancel-acceptance", "title": "取消订单：准备人工验收时怎么看", "category": "验收", "stage": "acceptance", "purpose": "按步骤亲自操作并复制反馈", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "待人工核验", "href": "cancel-acceptance/report.html", "simulation": true, "order": 4, "mode": "项目任务"}, {"id": "cancel-development", "title": "取消订单：开发中如何看实际改动", "category": "开发", "stage": "implementation", "purpose": "检查实际改动、偏差与待验证项", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "开发中", "href": "cancel-development/report.html", "simulation": true, "order": 3, "mode": "项目任务"}, {"id": "cancel-requirements", "title": "取消订单：需求还没说清时怎么看", "category": "需求", "stage": "requirements", "purpose": "确认 AI 是否理解对了目标和边界", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "理解需求", "href": "cancel-requirements/report.html", "simulation": true, "order": 1, "mode": "项目任务"}, {"id": "change-effective-scope", "title": "业务规则调整：哪些订单适用新规则", "category": "需求", "stage": "requirements", "purpose": "比较前后规则并确认生效范围", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "理解需求", "href": "change-effective-scope/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "order-cancel", "title": "订单取消：先整体设计，再分前后端实施（演示）", "category": "跨项目", "stage": "cross-project", "purpose": "先整体设计，再按项目看依赖和联调", "read_order": ["项目识别", "整体方案与契约", "开发进度和联调缺口"], "phase": "跨项目整体设计", "href": "cross-project-cancel/feature.html", "simulation": true, "order": 5, "mode": "跨项目功能"}, {"id": "migration-reconcile", "title": "数据迁移：先预演，再核对", "category": "工程", "stage": "implementation", "purpose": "检查转换、预演、异常记录和恢复路径", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "开发中", "href": "migration-reconcile/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "operations-checklist", "title": "发布前巡检：按操作顺序核对", "category": "运维", "stage": "operations", "purpose": "按顺序执行，明确停止和恢复条件", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "排查与运维", "href": "operations-checklist/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "order-cancellation", "title": "订单自助取消功能：请确认历史订单是否适用", "category": "方案", "stage": "solution", "purpose": "确认历史订单是否也适用新功能；这不是要求你选择技术架构。", "read_order": ["了解准备新增的取消能力", "阅读新订单/历史订单的两种范围", "填写 A 或 B 和补充条件，复制给 AI"], "phase": "确定方案", "href": "order-cancellation/report.html", "simulation": true, "order": 2, "mode": "项目任务"}, {"id": "performance-baseline", "title": "性能优化：先看测量，不看口号", "category": "工程", "stage": "implementation", "purpose": "核对环境、基线、目标和真实测量缺口", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "开发中", "href": "performance-baseline/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "production-incident", "title": "订单接口延迟升高：生产处置模板演示", "category": "运维", "stage": "operations", "purpose": "确认影响、当前处置和恢复依据", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "排查与运维", "href": "production-incident/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "refactor-invariants", "title": "重构：先看哪些行为不能变", "category": "工程", "stage": "implementation", "purpose": "先核对不变量，再审查结构变化和回归", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "开发中", "href": "refactor-invariants/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "upgrade-compatibility", "title": "技术升级：先检查兼容性", "category": "工程", "stage": "implementation", "purpose": "看兼容性、试点顺序及新旧对比证据", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "开发中", "href": "upgrade-compatibility/report.html", "simulation": true, "order": 99, "mode": "项目任务"}]</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent);
const stages=[['requirements','需求','弄清业务问题、使用场景和需要确认的边界。'],['solution','方案','理解完整方案，确认关键取舍后再进入开发。'],['implementation','开发','理解当前实现、行为变化与尚未完成的工作。'],['review','审查','核对实现与方案、检查问题和风险。'],['testing','测试','查看复现步骤、测试证据和待解决问题。'],['acceptance','验收','按具体场景核验结果，判断是否可以接受。'],['operations','运维','理解生产现象、处理动作和恢复依据。'],['release','发布','确认发布条件、执行顺序和回滚准备。'],['handoff','交接','确认交付内容、接手动作和遗留问题。'],['cross-project','跨项目协调','查看整体设计、项目分工与关联进度的独立总览。']].filter(stage=>data.some(item=>item.stage===stage[0]));
let selected=stages.some(stage=>stage[0]==='solution')?'solution':stages[0]?.[0];
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function link(item){const a=el('a','打开独立页面 ↗');a.setAttribute('href',item.href);a.setAttribute('target','_blank');a.setAttribute('rel','noopener');return a}
stages.forEach(stage=>{const button=el('button',stage[1]);button.type='button';button.dataset.stage=stage[0];button.onclick=()=>{selected=stage[0];document.getElementById('query').value='';render()};document.getElementById('filters').append(button)});
function render(){const phase=stages.find(stage=>stage[0]===selected);document.querySelectorAll('#filters button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.stage===selected)));document.getElementById('stage-title').textContent=phase?`${phase[1]}阶段示例`:'暂无阶段示例';document.getElementById('stage-purpose').textContent=phase?.[2]||'';const query=document.getElementById('query').value.trim().toLocaleLowerCase();const inStage=data.filter(item=>item.stage===selected);const visible=inStage.filter(item=>[item.title,item.purpose,item.category].join(' ').toLocaleLowerCase().includes(query));document.getElementById('count').textContent=`本阶段 ${visible.length} / ${inStage.length} 个独立页面 · 其他阶段请在上方切换`;const root=document.getElementById('groups');root.replaceChildren();visible.forEach(item=>{const card=el('article',undefined,'demo'),tags=el('div',undefined,'tags');tags.append(el('span',item.category,'tag'),el('span',item.mode,'tag'));card.append(tags,el('h3',item.title),el('p',item.purpose,'purpose'));const reading=el('div',undefined,'reading');reading.append(el('span','打开后重点看','muted'));const list=el('ol');item.read_order.forEach(step=>list.append(el('li',step)));reading.append(list);card.append(reading,link(item));root.append(card)});if(!visible.length)root.append(el('p','本阶段没有匹配场景。可清空关键词，或切换到其他阶段继续查找。','empty'))}
document.getElementById('query').addEventListener('input',render);render();
</script></body></html>

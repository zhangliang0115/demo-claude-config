<header><div class="wrap"><div class="eyebrow">ZL-DEV / 场景体验</div><h1>你现在想弄清楚哪一件事？</h1><p class="intro">这里是不同场景的独立页面。先选你要判断的事情，再按页面提示阅读：发生了什么、依据是什么、现在需要谁做什么。</p><p class="notice">全部为模拟案例，用于体验展示与反馈方式。示例中的原型、执行状态和测试记录不代表真实业务已经开发或验证。</p></div></header>
<main class="wrap"><section aria-labelledby="start"><h2 id="start">第一次看，从这三个问题开始</h2><div class="paths" id="paths"></div></section><div class="toolbar"><div class="filters" id="filters" role="group" aria-label="按场景筛选"></div><label><span class="muted">搜索场景 </span><input id="query" type="search" placeholder="例如：退款、故障、验收" aria-label="搜索场景"></label></div><p class="muted" id="count" aria-live="polite"></p><div id="groups"></div><footer>不同场景采用不同内容结构，共用视觉规范。页面反馈可填写并复制回 AI 会话；浏览器中的填写不会自动写入批准记录。</footer></main>

ry": "运维", "purpose": "按顺序执行，明确停止和恢复条件", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "排查与运维", "href": "operations-checklist/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "order-cancellation", "title": "订单自助取消功能：请确认历史订单是否适用", "category": "方案", "purpose": "确认历史订单是否也适用新功能；这不是要求你选择技术架构。", "read_order": ["了解准备新增的取消能力", "阅读新订单/历史订单的两种范围", "填写 A 或 B 和补充条件，复制给 AI"], "phase": "确定方案", "href": "order-cancellation/report.html", "simulation": true, "order": 2, "mode": "项目任务"}, {"id": "performance-baseline", "title": "性能优化：先看测量，不看口号", "category": "工程", "purpose": "核对环境、基线、目标和真实测量缺口", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "开发中", "href": "performance-baseline/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "production-incident", "title": "订单接口延迟升高：生产处置模板演示", "category": "运维", "purpose": "确认影响、当前处置和恢复依据", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "模拟演示 · 未执行生产操作", "href": "production-incident/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "refactor-invariants", "title": "重构：先看哪些行为不能变", "category": "工程", "purpose": "先核对不变量，再审查结构变化和回归", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "开发中", "href": "refactor-invariants/report.html", "simulation": true, "order": 99, "mode": "项目任务"}, {"id": "upgrade-compatibility", "title": "技术升级：先检查兼容性", "category": "工程", "purpose": "看兼容性、试点顺序及新旧对比证据", "read_order": ["先读任务目标", "看本场景的主要事实和例子", "处理当前动作或反馈"], "phase": "开发中", "href": "upgrade-compatibility/report.html", "simulation": true, "order": 99, "mode": "项目任务"}]</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),categories=[...new Set(['需求','方案','开发','验收','排障','运维','工程','跨项目',...data.map(x=>x.category)])];let selected='全部';
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function link(item,text,cls){const a=el('a',text,cls);a.setAttribute('href',item.href);return a}
const recommendations=[{title:'需求还不清楚，先明确要做什么',needle:'requirements',category:'需求',hint:'看用户问题、具体例子与待确认边界'},{title:'已有方向，理解整体方案',needle:'order-cancellation',category:'需求',hint:'看完整流程、选择理由与项目职责'},{title:'准备验收，判断结果能否接受',needle:'acceptance',category:'验收',hint:'看操作步骤、实际证据与剩余风险'}];
recommendations.forEach((path,i)=>{const ordered=data.filter(x=>x.order===i+1),exact=data.filter(x=>x.id===path.needle||x.href.includes(path.needle));const item=exact[0]||ordered[0]||data.find(x=>x.category===path.category);if(!item)return;const a=link(item,'','path');a.append(el('div',`0${i+1}`,'number'),el('strong',path.title),el('span',path.hint),el('p',item.title,'muted'));document.getElementById('paths').append(a)});
['全部',...categories].forEach(category=>{const button=el('button',category);button.type='button';button.setAttribute('aria-pressed',String(category===selected));button.onclick=()=>{selected=category;document.querySelectorAll('#filters button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()};document.getElementById('filters').append(button)});
function render(){const query=document.getElementById('query').value.trim().toLocaleLowerCase();const visible=data.filter(x=>(selected==='全部'||x.category===selected)&&[x.title,x.purpose,x.phase,x.category].join(' ').toLocaleLowerCase().includes(query));document.getElementById('count').textContent=`${visible.length} 个独立场景页面 · 点击“打开场景”查看具体内容`;const root=document.getElementById('groups');root.replaceChildren();[...categories,...new Set(visible.map(x=>x.category).filter(x=>!categories.includes(x)))].forEach(category=>{const items=visible.filter(x=>x.category===category);if(!items.length)return;const section=el('section',undefined,'group');section.append(el('h2',`${category} · ${items.length}`));const grid=el('div',undefined,'grid');items.forEach(item=>{const card=el('article',undefined,'demo'),tags=el('div',undefined,'tags');tags.append(el('span',item.mode,'tag'),el('span','模拟案例','tag sim'));card.append(tags,el('h3',item.title),el('p',item.purpose,'purpose'),el('p',item.phase,'phase'));const reading=el('div',undefined,'reading');reading.append(el('span','建议阅读顺序','muted'));const list=el('ol');item.read_order.forEach(step=>list.append(el('li',step)));reading.append(list);card.append(reading,link(item,'打开场景 →'));grid.append(card)});section.append(grid);root.append(section)});if(!visible.length)root.append(el('p','没有匹配场景，请换个关键词或选择其他分类。','empty'))}
document.getElementById('query').addEventListener('input',render);render();
</script></body></html>

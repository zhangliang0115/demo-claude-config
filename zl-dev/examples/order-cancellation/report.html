function renderStages(container, task) {
  const catalog = task.stage_catalog || {};
  const fallback = [['requirements','需求理解'],['solution','方案设计'],['handoff','交接接手'],['implementation','实施偏差'],['review','代码审查'],['testing','测试回放'],['acceptance','人工验收'],['release','发布检查'],['operations','生产运维']];
  const drafts = Object.create(null);
  const make = (tag, value, cls) => { const node=document.createElement(tag); if(value!==undefined)node.textContent=typeof value==='string'?value:JSON.stringify(value); if(cls)node.className=cls; return node; };
  const display = value => value===undefined||value===null||value===''?'尚未记录':typeof value==='string'?value:JSON.stringify(value);
  container.classList.add('stage-workspace');
  container.append(make('h2','按阶段理解、审查和交接'),make('p','固定模板展示当前记录；缺失不代表已完成。浏览器操作仅形成草稿，不会批准任务或执行生产动作。','warning'));
  const nav=make('div',undefined,'stage-nav');nav.setAttribute('aria-label','选择工作阶段');const body=make('div');container.append(nav,body);
  const fieldList = meta => Array.isArray(meta.fields)?meta.fields:[];
  function itemCard(parent,item,fields){const c=make('article',undefined,'card');c.append(make('h3',display(item.title||item.name||item.id)),make('span',display(item.status),'badge'));const dl=make('dl');fields.forEach(([key,label])=>{dl.append(make('dt',label),make('dd',display(item[key])));});c.append(dl);parent.append(c);return c;}
  function table(parent,items,fields){const wrap=make('div',undefined,'stage-tablewrap');wrap.tabIndex=0;wrap.setAttribute('aria-label','阶段记录，可横向滚动');const t=make('table');const h=make('thead'),hr=make('tr');[['id','编号'],['status','状态'],...fields.filter(([k])=>k!=='id'&&k!=='status')].forEach(([,label])=>{const th=make('th',label);th.scope='col';hr.append(th);});h.append(hr);t.append(h);const tbody=make('tbody');items.forEach(item=>{const row=make('tr');[['id'],['status'],...fields.filter(([k])=>k!=='id'&&k!=='status')].forEach(([key])=>row.append(make('td',display(item[key]))));tbody.append(row);});t.append(tbody);wrap.append(t);parent.append(wrap);}
  function exportDraft(stage){const payload={type:'stage-review-draft-not-approval',schema_version:1,task_id:task.id,revision:task.current_fingerprint,stage,created_at:new Date().toISOString(),responses:drafts[stage]||{}};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=make('a');a.href=url;a.download='stage-review-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function draw(key,label){body.replaceChildren();for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.stage===key));const meta=Array.isArray(catalog)?catalog.find(x=>x.id===key)||{}:catalog[key]||{};const details=(task.stage_details||{})[key]||{};const items=Array.isArray(details.items)?details.items:[];const fields=fieldList(meta);body.append(make('h3',meta.title||label),make('p',display(meta.focus),'muted'),make('p',display(details.summary)));
    const facts=make('div',undefined,'stage-facts');[['purpose','为什么看这一页'],['owner','负责的人'],['decision','人需要判断什么'],['exit_criteria','进入下一阶段的条件']].forEach(([field,title])=>{const box=make('article',undefined,'card');box.append(make('h3',title),make('p',display(details[field]||meta[field])));facts.append(box);});body.append(facts);
    if(!items.length){body.append(make('p','此阶段尚无记录。请按固定字段补充，不能据此判断阶段完成。','warning'));return;}
    if(key==='solution'){
      body.append(make('p','选择两项方案并排比较；选中不代表批准。','muted'));const controls=make('div',undefined,'stage-controls'),compare=make('div',undefined,'stage-compare');const selects=[0,1].map((initial,index)=>{const labelNode=make('label','比较方案 '+(index+1)+' ');const s=make('select');items.forEach((item,i)=>{const option=make('option',display(item.title||item.name||item.id));option.value=String(i);s.append(option);});s.value=String(Math.min(initial,items.length-1));labelNode.append(s);controls.append(labelNode);return s;});function repaint(){compare.replaceChildren();selects.forEach(s=>itemCard(compare,items[Number(s.value)],fields));}selects.forEach(s=>s.onchange=repaint);body.append(controls,compare);repaint();
    } else if(key==='review'){
      const controls=make('div',undefined,'stage-controls'),results=make('div');const selects=['severity','status'].map((field,index)=>{const l=make('label',index===0?'严重程度 ':'修复状态 ');const s=make('select');const all=make('option','全部');all.value='';s.append(all);[...new Set(items.map(item=>display(item[field])))].forEach(value=>{const o=make('option',value);o.value=value;s.append(o);});l.append(s);controls.append(l);return s;});function filter(){results.replaceChildren();const filtered=items.filter(item=>selects.every((s,i)=>!s.value||display(item[['severity','status'][i]])===s.value));results.append(make('p','显示 '+filtered.length+' / '+items.length+' 项'));table(results,filtered,fields);}selects.forEach(s=>s.onchange=filter);body.append(controls,results);filter();
    } else if(key==='testing'){
      body.append(make('p','这是记录回放，不会执行测试。模拟、运行记录与缺失证据必须分别核对。','warning'));const l=make('label','测试场景 '),s=make('select'),result=make('div');items.forEach((item,i)=>{const o=make('option',display(item.title||item.name||item.id));o.value=String(i);s.append(o);});l.append(s);body.append(l,result);function showCase(){result.replaceChildren();const item=items[Number(s.value)];itemCard(result,item,fields);result.append(make('p','记录类型：'+display(item.mode),'badge'));const evidenceIds=Array.isArray(item.evidence_ids)?item.evidence_ids:[];if(!evidenceIds.length)result.append(make('p','没有关联证据，不可视为执行成功。','warning'));evidenceIds.forEach(id=>{const evidence=(task.evidence||[]).find(e=>e.id===id);const box=make('details');box.append(make('summary','关联证据：'+id),make('pre',evidence?JSON.stringify(evidence,null,2):'引用的证据不存在，请补齐。'));result.append(box);});const steps=Array.isArray(item.steps)?item.steps:[];if(!steps.length){result.append(make('p','没有步骤记录，无法回放。'));return;}let cursor=0;const step=make('div',undefined,'stage-replay'),controls=make('div',undefined,'stage-controls'),prev=make('button','上一步'),next=make('button','下一步');function showStep(){const value=steps[cursor];step.replaceChildren(make('h3','步骤 '+(cursor+1)+' / '+steps.length),make('p','操作：'+display(value.action)),make('p','预期：'+display(value.expected)),make('p','实际：'+display(value.actual)));prev.disabled=cursor===0;next.disabled=cursor===steps.length-1;}prev.onclick=()=>{cursor--;showStep();};next.onclick=()=>{cursor++;showStep();};controls.append(prev,next);result.append(step,controls);showStep();}s.onchange=showCase;showCase();
    } else if(key==='acceptance'||key==='release'){
      body.append(make('p','下面填写的结果仅保留在当前页面内存中。请导出草稿，再由责任人确认；刷新页面将丢失未导出内容。','warning'));drafts[key]=drafts[key]||Object.create(null);items.forEach((item,index)=>{const c=itemCard(body,item,fields);const draftKey=String(item.id||index);const saved=drafts[key][draftKey]||(drafts[key][draftKey]={result:'pending',comment:''});const labelNode=make('label','核验结果 '),s=make('select');[['pending','尚未核验'],['pass','符合预期（草稿）'],['fail','不符合预期（草稿）'],['blocked','无法核验（草稿）']].forEach(([value,label])=>{const o=make('option',label);o.value=value;s.append(o);});s.value=saved.result;s.onchange=()=>saved.result=s.value;labelNode.append(s);const commentLabel=make('label','实际观察 / 理由 '),area=make('textarea');area.value=saved.comment;area.oninput=()=>saved.comment=area.value;commentLabel.append(area);c.append(labelNode,commentLabel);});const button=make('button','导出本阶段核验草稿');button.onclick=()=>exportDraft(key);body.append(button);
    } else if(key==='operations'){
      body.append(make('p','观察、假设、授权、执行和恢复验证分别记录。此页面不执行运维命令。','warning'));const timeline=make('ol',undefined,'stage-timeline');items.forEach(item=>{const li=make('li');itemCard(li,item,fields);timeline.append(li);});body.append(timeline);
    } else table(body,items,fields);
  }
  fallback.forEach(([key,label])=>{const button=make('button',label);button.type='button';button.dataset.stage=key;button.setAttribute('aria-pressed','false');button.onclick=()=>draw(key,label);nav.append(button);});draw(...fallback[0]);
}

renderStages($('stage-views'), task);
</script></html>

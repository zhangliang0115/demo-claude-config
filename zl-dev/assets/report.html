<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>__PAGE_TITLE__ · 理解与验收</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182c39;background:#eef2f4}*{box-sizing:border-box}body{margin:0}header{background:#123748;color:white;padding:36px max(24px,calc((100vw - 1120px)/2))}header p{color:#c9dde5}h1{font-size:32px;margin:12px 0}h2{font-size:23px}h3{font-size:17px}main{max-width:1168px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}button{cursor:pointer;background:white;border:1px solid #bdcbd2;border-radius:8px;padding:10px 16px;color:#234556;font:inherit}button[aria-selected=true],button.active{background:#166779;color:white;border-color:#166779}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d99b28;outline-offset:2px}.panel[hidden]{display:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}.card{background:white;border:1px solid #d6e0e5;border-radius:12px;padding:20px;margin-bottom:16px}.badge{display:inline-block;border-radius:20px;padding:5px 11px;background:#e3eef1;font-size:13px;color:#244b59}.warning{border-left:4px solid #bd8121;background:#fff9eb;padding:16px;border-radius:5px}.muted{color:#637580;font-size:14px}p,li,td{line-height:1.7;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3f5;padding:14px;border-radius:8px}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:14px;border-bottom:1px solid #dce5e9;vertical-align:top}th{background:#e6eef2}.tablewrap{overflow:auto}.scene-buttons{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.step{border-left:3px solid #238396;padding:4px 20px;margin:20px 0}select{font:inherit;max-width:100%;padding:10px;border-radius:8px}input,textarea{font:inherit;padding:12px;border:1px solid #bacbd2;border-radius:7px;width:100%}textarea{min-height:85px}details{margin-top:12px}summary{cursor:pointer;color:#176478}footer{margin:32px 0;color:#637580;font-size:13px}
[hidden]{display:none!important}.reading-tools{margin:20px 0}.quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.next-action{border-top:4px solid #166779}.decision-preview{border-left:3px solid #d99b28}.overview-heading{margin-top:0}
.scene-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}.scene-action{border-left:4px solid #166779}.scene-timeline{padding-left:24px;border-left:3px solid #759ba7}.scene-timeline>li{padding:0 0 20px 12px}.scene-matrix{overflow-x:auto}.scene-matrix table{min-width:520px}.scene-flow{display:flex;gap:12px;overflow-x:auto;padding:12px 0}.scene-flow>.card{min-width:220px;flex:1}dt{font-weight:600}dd{margin:4px 0 14px;overflow-wrap:anywhere}
/* STAGE_STYLES */
</style>
<header><span id="kind"></span><h1 id="title"></h1><p id="summary"></p><span class="badge" id="stage"></span></header>
<main><section class="panel" id="overview"></section><details class="reading-tools" id="reading-tools"><summary>按需查看详细材料</summary><div class="quick-actions"><label for="section-select">材料：</label><select id="section-select" aria-label="选择详细材料"></select><button id="show-section" type="button">查看</button><button id="home-button" type="button">返回任务概览</button></div></details><section class="panel" id="scenarios" hidden></section><section class="panel" id="behavior" hidden></section><section class="panel" id="implementation" hidden></section><section class="panel" id="decisions" hidden></section><section class="panel" id="evidence" hidden></section><section class="panel" id="design" hidden></section><section class="panel" id="handoffs" hidden></section><section class="panel" id="operations" hidden></section><section class="panel" id="stage-views" hidden></section><footer>本页面是生成时的快照，不会自动运行测试或同步审批。代码、需求变更后请重新生成。所有模拟均不能作为运行成功证据。</footer></main>
<script id="task-data" type="application/json">__TASK_DATA__</script>
<script>
'use strict';
const task=JSON.parse(document.getElementById('task-data').textContent);
const $=id=>document.getElementById(id);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=typeof text==='string'?text:JSON.stringify(text);if(cls)n.className=cls;return n;}
function text(value){return value===undefined||value===null||value===''?'尚未记录':typeof value==='string'?value:JSON.stringify(value);}
function feedbackComposer(parent,task,stage,buildBody){
  const box=el('article',undefined,'card feedback-composer');
  box.append(el('h3','填写后复制给 AI'),el('p','内容只保留在当前页面；复制后粘贴到开发会话。刷新会丢失尚未复制的内容。'));
  const label=el('label','可复制的反馈预览'),preview=el('textarea');preview.readOnly=true;preview.rows=12;preview.setAttribute('aria-label','可复制的反馈预览');label.append(preview);
  const button=el('button','复制反馈'),status=el('p','尚未填写','muted');button.type='button';status.setAttribute('role','status');status.setAttribute('aria-live','polite');
  function update(){const body=buildBody().trim();preview.value=['任务：'+text(task.title),'任务 ID：'+text(task.id),'页面版本：'+text(task.current_fingerprint),'页面生成时间：'+text(task.generated_at),'反馈阶段：'+stage,'','请先核对任务 ID 和当前版本。若与此页面不同，请先说明差异并重新确认，再应用反馈。','以下是我的反馈；未填写的事项保持待确认。','',body||'尚未填写'].join('\n');button.disabled=!body;status.textContent=body?'填写完成后点击复制反馈，再粘贴到开发会话。':'尚未填写';}
  button.onclick=async()=>{const value=preview.value;try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(value);status.textContent=preview.value===value?'反馈已复制，请粘贴到开发会话。':'已复制点击时的反馈；内容已变化，请重新复制。';}catch(_){preview.focus();preview.select();preview.setSelectionRange(0,preview.value.length);status.textContent='浏览器未能自动复制，已选中文本，请按 Ctrl+C 或 Cmd+C 复制。';}};
  box.append(label,button,status);parent.append(box);update();return update;
}
function card(parent,title,body){const n=el('article',undefined,'card');n.append(el('h3',title),el('p',text(body)));parent.append(n);return n;}
function list(parent,title,items){const c=card(parent,title,items.length?'':'尚未记录');if(items.length){c.lastChild.remove();const ul=el('ul');items.forEach(x=>ul.append(el('li',text(x))));c.append(ul);}return c;}
$('title').textContent=task.title;$('kind').textContent=task.kind_label;$('summary').textContent=text(task.summary);$('stage').textContent=text((task.workflow_summary||{}).stage_label||task.stage)+(/模拟|演示/.test(task.stage||'')?' · '+task.stage:'');document.querySelector('footer').append(el('p','生成时间：'+task.generated_at));
const tabs=[['overview','任务概览'],['stage-views','当前阶段材料'],['scenarios','场景演示'],['behavior','业务变化'],['implementation','实现解释'],['decisions','需要你决定'],['evidence','验证证据'],['design','方案与职责'],['handoffs','交接记录'],['operations','生产与运维']];
const has=key=>Array.isArray(task[key])&&task[key].length>0;
const populated={overview:true,'stage-views':Object.values(task.stage_details||{}).some(x=>x&&((x.items||[]).length||x.summary)),scenarios:has('scenarios'),behavior:has('behaviors'),implementation:has('implementation'),decisions:has('decisions'),evidence:has('evidence'),design:has('design')||has('roles')||has('assumptions'),handoffs:has('handoffs')||has('timeline'),operations:has('operations')};
function detailsOpen(open){$('reading-tools').open=open;}
function show(id){if(!$(id))return;tabs.forEach(([key])=>{if($(key))$(key).hidden=key!==id;});if(id!=='overview'){detailsOpen(true);$('section-select').value=id;}else detailsOpen(false);}
$('home-button').onclick=()=>show('overview');
tabs.filter(([key])=>key!=='overview'&&populated[key]).forEach(([key,label])=>{const option=el('option',label);option.value=key;$('section-select').append(option);});
$('show-section').onclick=()=>show($('section-select').value);
if(!$('section-select').children.length)$('reading-tools').hidden=true;
const workflow=task.workflow_summary||{};
const evidenceRecords=task.evidence||[];
const pendingDecisions=(task.decisions||[]).filter(d=>d.status!=='confirmed');
const uncovered=(task.behaviors||[]).filter(b=>!evidenceRecords.some(e=>(e.behavior_ids||[]).includes(b.id)&&e.status==='passed'&&e.freshness==='当前')).length;
const stale=evidenceRecords.filter(e=>e.freshness&&e.freshness!=='当前').length;
const decision=pendingDecisions[0];
const next=el('article',undefined,'card next-action');next.append(el('span',workflow.stage_label||task.stage,'badge'),el('h2',decision?'现在需要你决定':'现在要做的事'));
if(decision){next.append(el('h3',text(decision.question)),el('p','建议：'+text(decision.recommendation)));const btn=el('button','填写判断');btn.onclick=()=>show('decisions');next.append(btn);if(pendingDecisions.length>1)next.append(el('p','另有 '+(pendingDecisions.length-1)+' 项待决问题，可在详细材料中查看。','muted'));}
else next.append(el('p',workflow.next_action||'确认上述目标和例子是否符合需求，再开始下一轮实施。'));
if(workflow.action_owner)next.append(el('p','由谁处理：'+text(workflow.action_owner)));
$('overview').append(next);
// VIEW_SCRIPT
const viewRoot=el('div');$('overview').append(viewRoot);
const viewUI={el,card,list,text,show};
const renderView=task.kind==='incident'?renderIncidentView:task.kind==='bugfix'?renderBugfixView:task.kind==='operations'?renderOperationsView:['refactor','performance','migration','upgrade'].includes(task.kind)?renderEngineeringView:renderFeatureView;
renderView(viewRoot,task,viewUI);
const checks=el('details');checks.append(el('summary','验收进展与剩余风险'));
card(checks,'验证现状',`${uncovered} 条行为缺少当前通过证据；${stale} 条证据需要重新核对。`);
list(checks,'亲自验收',task.acceptance||[]);list(checks,'风险与未覆盖项',task.risks||[]);list(checks,'自上次更新后的变化',task.changes||[]);card(checks,'范围与边界',task.scope);card(checks,'停用与恢复',task.rollback);$('overview').append(checks);
const sceneHints={feature:'选择用户操作，理解正常及异常路径。',change:'比较规则调整前后，关注历史数据和生效范围。',bugfix:'先看复现条件，再看修复如何阻断问题。',refactor:'结构可以变化，对外行为应保持。',performance:'比较相同条件下的基线与结果。',migration:'核对数据转换、异常处理和恢复路径。',upgrade:'关注兼容性变化与新旧实现的一致性。',incident:'区分现场事实、诊断假设、止损动作和恢复证据。',operations:'先确认操作范围与授权，再核对执行结果和恢复条件。'};
$('scenarios').append(el('h2','从一个具体例子理解'),el('p',sceneHints[task.kind]));const sceneButtons=el('div',undefined,'scene-buttons'),sceneContent=el('div');$('scenarios').append(sceneButtons,sceneContent);
function scene(index){sceneContent.replaceChildren();[...sceneButtons.children].forEach((b,i)=>b.classList.toggle('active',i===index));const s=task.scenarios[index];card(sceneContent,s.title,s.kind==='simulation'?'设计模拟：用于理解预期行为，未证明实际实现成功。':'记录回放：来自任务提供的记录，请对照证据确认来源。');(s.steps||[]).forEach((step,i)=>{const n=el('div',undefined,'step');n.append(el('h3',`${i+1}. ${text(step.action)}`),el('p',text(step.result)));sceneContent.append(n);});}
(task.scenarios||[]).forEach((s,i)=>{const b=el('button',s.title);b.onclick=()=>scene(i);sceneButtons.append(b);});if((task.scenarios||[]).length)scene(0);else card(sceneContent,'暂无场景','补充具体输入、操作和预期结果。');
$('behavior').append(el('h2','哪些行为变了'));const search=el('input');search.type='search';search.placeholder='搜索规则、前后行为或状态';search.setAttribute('aria-label','筛选业务规则');$('behavior').append(search);const wrap=el('div',undefined,'tablewrap'),table=el('table');wrap.append(table);$('behavior').append(wrap);
function rows(){table.replaceChildren();const head=el('tr');['编号','原来','现在','确认 / 实现状态'].forEach(x=>head.append(el('th',x)));table.append(head);(task.behaviors||[]).filter(b=>JSON.stringify(b).toLowerCase().includes(search.value.toLowerCase())).forEach(b=>{const r=el('tr');[b.id,b.before,b.after,b.status].forEach(x=>r.append(el('td',text(x))));table.append(r);});}search.oninput=rows;rows();
$('implementation').append(el('h2','实现如何支持业务行为'));(task.implementation||[]).forEach((i,index)=>{const c=card($('implementation'),`${index+1}. ${i.title}`,i.description);const d=el('details');d.append(el('summary','代码位置（人工核对）'),el('pre',text(i.files)));c.append(d);});if(!(task.implementation||[]).length)card($('implementation'),'暂无实现记录','完成代码检查后补充，不以设计代替实际实现。');
$('decisions').append(el('h2','集中处理需要判断的问题'),el('p','填写判断后复制反馈，粘贴给 AI。不会自动批准或写入项目。','warning'));const notes=Object.create(null);let updateDecisionFeedback=()=>{};(task.decisions||[]).forEach(d=>{const c=card($('decisions'),`${d.id}: ${d.question}`,`建议：${text(d.recommendation)} · 当前状态：${text(d.status)}`);const label=el('label','你的判断 / 补充条件');const area=el('textarea');area.setAttribute('aria-label',`${d.id} 决策草稿`);area.oninput=()=>{notes[d.id]=area.value;updateDecisionFeedback();};label.append(area);c.append(label);});updateDecisionFeedback=feedbackComposer($('decisions'),task,'业务决策',()=> (task.decisions||[]).filter(d=>(notes[d.id]||'').trim()).map(d=>`问题 ${d.id}：${d.question}\n我的反馈：${notes[d.id].trim()}`).join('\n\n'));

$('evidence').append(el('h2','为什么相信这次改动'),el('p','通过状态是任务记录声明；代码指纹匹配只说明内容未变，不证明命令实际运行。请核对原始结果。','warning'));(task.evidence||[]).forEach(e=>{const c=card($('evidence'),`${e.id}: ${text(e.status)} · ${e.freshness}`,e.summary);c.append(el('p',`关联规则：${text(e.behavior_ids)}`));c.append(el('p',`执行者 / 工具：${text(e.actor)} · 环境：${text(e.environment)}`));const d=el('details');d.append(el('summary','运行命令与版本指纹'),el('pre',`命令：${text(e.command)}\n结果来源：${text(e.source)}\n执行时间：${text(e.executed_at)}\n证据指纹（代码＋行为约定）：${text(e.revision)}\n当前指纹：${text(task.current_fingerprint)}`));c.append(d);});if(!(task.evidence||[]).length)card($('evidence'),'没有运行证据','尚不能根据演示或实现说明判定验收通过。');

function recordCards(target,title,rows,fields){$(target).append(el('h2',title));if(!rows.length){card($(target),'尚未记录','缺失不表示已确认；交接或操作前补齐。');return;}rows.forEach(row=>{const c=el('article',undefined,'card');fields.forEach(([key,label])=>{if(row[key]!==undefined){c.append(el('h3',label),el('p',text(row[key])));}});$(target).append(c);});}
recordCards('design','角色与责任',task.roles||[],[['role','职责'],['owner','负责人'],['responsibility','负责的决定与交付'],['accepts','接受条件']]);
recordCards('design','事实、假设与待验证',task.assumptions||[],[['id','编号'],['statement','内容'],['basis','依据'],['status','状态'],['owner','确认人'],['check','验证办法']]);
recordCards('design','方案与取舍',task.design||[],[['id','编号'],['title','方案'],['description','如何工作'],['alternatives','比较过的选择'],['tradeoffs','代价与风险'],['status','确认状态']]);
$('handoffs').append(el('p','把 task.json、HTML、HANDOFF.md 和必要证据一起交接。接收者先复述理解，未确认的问题不能自动变成要求。','warning'));
recordCards('handoffs','每次交接都明确由谁接住',task.handoffs||[],[['id','编号'],['from','交出人 / 职责'],['to','接收人 / 职责'],['deliverable','交付范围与版本'],['readback','接收者复述'],['open_questions','未解决问题'],['status','接收状态'],['actor','记录者 / AI 工具 / 模型'],['at','时间']]);
recordCards('handoffs','阶段与变更记录',task.timeline||[],[['at','时间'],['actor','执行者 / 工具'],['action','发生了什么'],['reason','原因'],['impact','影响范围']]);
$('operations').append(el('p','此页面不执行生产操作。建议动作、已批准动作、已执行动作和已验证恢复必须分开记录。','warning'));
recordCards('operations','诊断、操作与恢复',task.operations||[],[['id','编号'],['type','诊断 / 变更 / 止损 / 恢复'],['environment','环境与目标范围'],['impact','用户影响'],['observation','已观察事实'],['hypothesis','待验证假设'],['action','计划动作'],['authorization','授权来源与范围'],['stop_condition','停止条件'],['rollback','恢复办法'],['result','实际结果'],['verification','恢复验证'],['status','状态'],['owner','负责人']]);

// STAGE_SCRIPT
renderStages($('stage-views'), task);
</script></html>
